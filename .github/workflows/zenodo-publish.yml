name: Publish to Zenodo

# Triggers when a GitHub Release is published. Deposits the PDF ONLY as a new
# version under the existing concept DOI — the record is the paper, never a
# repository snapshot. The Zenodo-GitHub integration webhook for this repo was
# removed 2026-08-14 (it archived the full tree, which leaked internal working
# documents into published versions); this workflow replaces it.
#
# Requires repo secret ZENODO_TOKEN (scopes deposit:write + deposit:actions).

on:
  release:
    types: [published]

permissions:
  contents: write   # append the minted DOI to the release notes

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      # The deposited CONTENT must come from the tag — that is the published record.
      # The publish TOOLING should not. When the v1.1 deposit failed on a Zenodo-side
      # error, the fix could not reach the runner, because a re-run checks out the tag
      # and the tag predates the fix. Overlaying the script from the default branch
      # keeps operational fixes applicable to an already-cut tag without moving it.
      - name: Use current publish tooling (content still from the tag)
        run: |
          git fetch --depth=1 origin "${{ github.event.repository.default_branch }}"
          git checkout FETCH_HEAD -- scripts/publish-to-zenodo.sh
          echo "publish script overlaid from ${{ github.event.repository.default_branch }}"

      - name: Probe the Zenodo API before depositing
        run: |
          # Confirmed 2026-08-14: /versions/latest intermittently returns
          #   <html><body><h1>504 Gateway Time-out</h1>
          # and column 20 of that line is the "504", which is exactly the
          # "jq: parse error: Invalid numeric literal at line 1, column 20" that
          # killed the first v1.1 deposit attempt. It is a Zenodo-side timeout, not
          # anything specific to Actions — the same 504 reproduces from a
          # workstation. The publish script retries; this step just records what the
          # API was doing at deposit time, so a future failure is diagnosable from
          # the log alone.
          code="$(curl -sSL --max-time 90 -o /tmp/probe.json -w '%{http_code}' \
            -H 'Accept: application/json' \
            "https://zenodo.org/api/records/21930092/versions/latest" || echo 000)"
          echo "HTTP ${code}, $(wc -c </tmp/probe.json) bytes"
          jq -e . /tmp/probe.json >/dev/null 2>&1 \
            && echo "valid JSON — API healthy" \
            || { echo "NOT valid JSON — first 300 bytes:"; head -c 300 /tmp/probe.json; echo; }

      - name: Verify required files
        run: |
          test -f digital-proprioception.pdf || { echo "::error::digital-proprioception.pdf not found at tag"; exit 1; }
          test -f .zenodo.json || { echo "::error::.zenodo.json not found"; exit 1; }
          test -f scripts/publish-to-zenodo.sh || { echo "::error::scripts/publish-to-zenodo.sh missing"; exit 1; }

      - name: Publish to Zenodo (PDF only)
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_CONCEPT_RECID: "21930092"
        run: |
          set -eo pipefail
          chmod +x scripts/publish-to-zenodo.sh
          # This concept's version strings carry no "paper-" prefix (v1.0, v1.0.2).
          # Take the version from .zenodo.json rather than the tag, so the deposited
          # version list stays internally consistent.
          ZENODO_VERSION="$(jq -r '.version' .zenodo.json)"
          [ -n "$ZENODO_VERSION" ] && [ "$ZENODO_VERSION" != "null" ] || {
            echo "::error::.zenodo.json has no version field"; exit 1; }
          echo "depositing Zenodo version string: ${ZENODO_VERSION}"
          export ZENODO_VERSION
          ./scripts/publish-to-zenodo.sh \
            "${{ github.event.release.tag_name }}" \
            "digital-proprioception.pdf" \
            | tee zenodo-publish.log

      - name: Append Zenodo DOI to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          doi_url="$(grep -oE 'https://doi.org/10\.5281/zenodo\.[0-9]+' zenodo-publish.log | head -n1 || true)"
          if [[ -z "$doi_url" ]]; then
            echo "::warning::could not extract DOI from publish output; skipping release-notes update"
            exit 0
          fi
          tag="${{ github.event.release.tag_name }}"
          current_body="$(gh release view "$tag" --json body --jq .body)"
          if printf '%s' "$current_body" | grep -q "$doi_url"; then
            echo "release notes already mention $doi_url"
            exit 0
          fi
          appended="$(printf '%s\n\n---\nZenodo: %s\n' "$current_body" "$doi_url")"
          gh release edit "$tag" --notes "$appended"
